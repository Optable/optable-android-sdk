name: Android SDK CI

on:
  pull_request:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  # Called by tag.yml after it pushes a tag. A tag pushed with GITHUB_TOKEN does
  # not start another workflow run, so the push trigger above will not fire for
  # that tag and CI has to be invoked directly.
  workflow_call:

jobs:
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      - run: ./gradlew --no-daemon test
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/*/*.html
  demo-java:
    name: Build Demo Java
    needs: [sdk-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      - run: ./gradlew --no-daemon -p DemoApp/DemoAppJava assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: java-demo-apk
          path: DemoApp/DemoAppJava/app/build/outputs/apk/release/*.apk
  demo-kotlin:
    name: Build Demo Kotlin
    needs: [sdk-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0
      - run: ./gradlew --no-daemon -p DemoApp/DemoAppKotlin assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-demo-apk
          path: DemoApp/DemoAppKotlin/app/build/outputs/apk/release/*.apk
