name: Tag release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor

permissions:
  contents: read

jobs:
  tag:
    name: Tag master
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Refuse to release from anything but master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Release must run on master, got ${{ github.ref }}. Re-run and pick master."
          exit 1

      # The restrict-release-tags ruleset only lets bypass actors create v* tags, and GITHUB_TOKEN isn't one.
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_ACTION_REPO_WRITE_APP_ID }}
          private-key: ${{ secrets.GH_ACTION_REPO_WRITE_APP_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          latest=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          latest=${latest:-0.0.0}
          IFS=. read -r major minor patch <<<"${latest}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="v${major}.${minor}.${patch}"
          echo "${latest} -> ${version}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          {
            echo "### Release \`${version}\`"
            echo ""
            echo "Previous: \`${latest}\` · bump: \`${BUMP}\` · commit: \`${GITHUB_SHA:0:7}\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Create and push tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
          APP_ID: ${{ vars.GH_ACTION_REPO_WRITE_APP_ID }}
          APP_SLUG: ${{ steps.generate-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          for tag in "${VERSION}" "${VERSION#v}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists. Someone tagged out of band."
              exit 1
            fi
          done
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

  ci:
    # Called directly so the release waits on CI; the tag push also starts its own CI run.
    name: CI
    needs: tag
    uses: ./.github/workflows/android-sdk-ci.yml

  release:
    name: GitHub release
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${VERSION}" --generate-notes
