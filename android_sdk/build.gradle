plugins {
    id("com.android.library") version "8.9.3"
    id("org.jetbrains.kotlin.android") version "2.0.21"
    id("de.nanogiants.android-versioning") version "2.4.0"
}

android {
    compileSdk 35

    defaultConfig {
        namespace "co.optable"
        minSdkVersion 23
        targetSdkVersion 35

        // Here we get version code and version name from latest git release tags:
        versionCode versioning.getVersionCode()
        versionName versioning.getVersionName(false)
        archivesBaseName = "optable-android-sdk"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField "String", "VERSION_NAME", "\"${versioning.getVersionName(false)}\""
        buildConfigField "String", "VERSION_CODE", "\"${versioning.getVersionCode().toString()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    // Network
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.2'

    // Shared preferences
    implementation "androidx.preference:preference-ktx:1.2.1"

    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.4"

    // Advertising ID
    implementation 'com.google.android.gms:play-services-ads-identifier:18.2.0'

    // Unit tests
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.mockito:mockito-core:5.12.0")
    testImplementation("org.mockito.kotlin:mockito-kotlin:5.4.0")
    testImplementation("com.squareup.okhttp3:mockwebserver:4.12.0")
    testImplementation("org.robolectric:robolectric:4.16")

    // UI tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}