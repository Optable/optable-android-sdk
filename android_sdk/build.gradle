plugins {
    id("com.android.library") version "8.9.3"
    id("org.jetbrains.kotlin.android") version "2.0.21"
    id("de.nanogiants.android-versioning") version "2.4.0"
}

// TODO: Check
//apply plugin: 'de.mobilej.unmock'

//unMock {
//    keep "android.net.Uri"
//    keepStartingWith "libcore."
//    keepAndRename "java.nio.charset.Charsets" to "xjava.nio.charset.Charsets"
//}

android {
    compileSdk 34

    defaultConfig {
        // TODO: Check
        namespace "co.optable"
        minSdkVersion 23
        targetSdkVersion 34

        // Here we get version code and version name from latest git release tags:
        versionCode versioning.getVersionCode()
        versionName versioning.getVersionName(false)
        archivesBaseName = "optable-android-sdk"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField "String", "VERSION_NAME", "\"${versioning.getVersionName(false)}\""
        buildConfigField "String", "VERSION_CODE", "\"${versioning.getVersionCode().toString()}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.android.gms:play-services-ads:24.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}