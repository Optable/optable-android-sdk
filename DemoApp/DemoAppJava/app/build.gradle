plugins {
    id("com.android.application") version "8.9.3"
    id("org.jetbrains.kotlin.android") version "2.0.21"
}

android {
    compileSdk 35
    namespace "co.optable.demoappjava"

    defaultConfig {
        applicationId "co.optable.demoappjava"
        minSdkVersion 23
        targetSdkVersion 34

        versionCode 1
        versionName "1.0.0"
        archivesBaseName = "optable-android-sdk-demo-java"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Optable SDK
    if (useReleaseSdk == "true") {
        implementation "com.github.Optable:optable-android-sdk:v1.2.0"
    } else {
        implementation "co.optable:local-sdk"
    }

    // Google Mobile Ads
    implementation 'com.google.android.gms:play-services-ads:24.6.0'

    // Prebid Ads
    implementation "org.prebid:prebid-mobile-sdk:3.0.2"

    // Base Android
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'
    implementation 'androidx.preference:preference:1.2.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
