plugins {
    id("com.android.application") version "8.9.3"
    id("org.jetbrains.kotlin.android") version "2.0.21"
    id("de.nanogiants.android-versioning") version "2.4.0"
}

android {
    compileSdk 34
    namespace "co.optable.androidsdkdemo"

    defaultConfig {
        applicationId "co.optable.androidsdkdemo"
        minSdkVersion 23
        targetSdkVersion 34

        versionCode versioning.getVersionCode()
        versionName versioning.getVersionName(false)
        archivesBaseName = "optable-android-sdk-demo-kotlin"

        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // Optable SDK
    // TODO: Return to this version after release
//    implementation "com.github.Optable:optable-android-sdk:" + versioning.getVersionName(false)
    implementation "com.github.Optable:optable-android-sdk:master"

    // Google Mobile Ads
    implementation 'com.google.android.gms:play-services-ads:24.6.0'

    // Base Android
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.1.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
